[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "costbomb"
version = "0.2.0.dev0"
description = "Denial-of-wallet fuzzing for agent systems — find the inputs that make your agent spend $500 to answer a $0.05 question, and gate CI on spend regressions."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Swarm Proof" }]
keywords = [
    "agents", "llm", "reliability", "fuzzing", "denial-of-wallet",
    "cost", "finops", "security", "ci", "opentelemetry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

# Core stays intentionally light so `pip install costbomb` + `--dry-run` works
# with zero network/LLM (NFR-6, NFR-10). The search loop is pure Python; heavy
# integrations live in extras. Matches stampede's dependency posture.
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Live (paid) targets — provider-agnostic (NFR-3). Pricing stays table-driven;
# no provider is hardcoded in logic.
providers = ["anthropic>=0.40", "openai>=1.40"]
# HTTPTarget against a real agent endpoint.
http = ["httpx>=0.27"]
# OTLP export of findings to any OTel GenAI backend (REQ-RP-5, NFR-9).
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[project.scripts]
costbomb = "costbomb.cli:app"

[project.urls]
Homepage = "https://github.com/swarmproof/costbomb"
Repository = "https://github.com/swarmproof/costbomb"
Issues = "https://github.com/swarmproof/costbomb/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/costbomb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["costbomb"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["costbomb"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
